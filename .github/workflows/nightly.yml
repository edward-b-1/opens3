# Nightly Docker-tier suites: Ceph s3-tests conformance, the AWS CLI
# end-to-end suite, the console lint + browser test and the master key
# rotation lifecycle.
name: nightly
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
jobs:
  suites:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make conformance
      - run: make awscli
      - run: make console-test
      - run: make rotation-test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            docs/CONFORMANCE.md
            docs/AWSCLI.md
            tests/console/results/junit.xml
